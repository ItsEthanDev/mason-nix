conky.config = {
    use_xft = true,
    xftalpha = 0.8,
    update_interval = 1.0,
    total_run_times = 0,
    own_window = true,
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_type = 'desktop',
    own_window_class = 'conky-system',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    background = true,
    double_buffer = true,
    imlib_cache_size = 0,
    no_buffers = true,
    uppercase = false,
    cpu_avg_samples = 2,
    override_utf8_locale = true,

    -- placement
    alignment = 'middle_left',
    gap_x = @SYSTEM_GAP_X@,
    gap_y = 0,
    minimum_width = 590,
    maximum_width = 590,

    -- default drawing
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = true,
    default_bar_width = 400, default_bar_height = 5,
    default_graph_width = 400, default_graph_height = 12,
    default_gauge_width = 20, default_gauge_height = 20,

    -- colors
    font = 'Sarasa Mono J:size=9',
    default_color = '@COLOR_DEFAULT@',
    color1 = '@COLOR1@',
    color2 = '@COLOR2@',
    color3 = '@COLOR3@',

    -- layouting
    template0 = [[${font Exo 2:size=12}${color2}\1 ${color3}${hr 1}${font}]],
    template1 = [[${color1}\1]],
    template2 = [[${goto 100}${color}]],
    template3 = [[${goto 180}${color}${alignr}]],
};

conky.text = [[
${template0 System}
${template1 \ Time}                                                           ${template3}${time %T}
${template1 \ Host}                                                       ${template3}${nodename}
${template1 \ Linux}                                                         ${template3}${kernel}
${template1 \ Uptime}                                                         ${template3}${uptime_short}

${template1 \ CPU}                                                        ${template3}@CPU_MODEL@
${template1 \ CPU\ Frequency}                                                    ${template3}${freq_g}GHz
${template1 \ CPU\ Temperature}                                               ${template3}${execi 10 @SENSORS@ | grep -m 1 'Package id 0' | awk '{printf "%.1f °C", $4}' | tr -d '+'}

${template1 \ GPU}                                                        ${template3}@GPU_MODEL@
${template1 \ GPU\ Temperature}                                               ${template3}${execi 10 @NVIDIA_SMI@ --query-gpu=temperature.gpu --format=csv,noheader,nounits | awk '{printf "%.1f °C", $1}'}
${template1 \ GPU\ Utilization}                                              ${template3}${execi 10 @NVIDIA_SMI@ --query-gpu=utilization.gpu --format=csv,noheader,nounits | awk '{printf "%s %%", $1}'}
${template1 \ GPU\ Memory}                                                    ${template3}${execi 10 @NVIDIA_SMI@ --query-gpu=memory.used,memory.total --format=csv,noheader,nounits | awk -F', ' '{printf "%s / %s MiB", $1, $2}'}
${template1 \ GPU\ Power}                                                     ${template3}${execi 10 @NVIDIA_SMI@ --query-gpu=power.draw --format=csv,noheader,nounits}

${template0 Processors}
${template1 \ Load}               ${template2}${loadavg 1}%                    ${template3}${loadgraph}

@CPU_CORE_LINES@

${template1 \ Top\ 1}             ${template2}${top name 1}                   ${template3}${top cpu 1}%
${template1 \ Top\ 2}             ${template2}${top name 2}                   ${template3}${top cpu 2}%
${template1 \ Top\ 3}             ${template2}${top name 3}                   ${template3}${top cpu 3}%

${template0 Memory}
${template1 \ RAM}             ${template2}${memperc}% used                ${template3}${mem} / ${memmax}
                                                                            ${template3}${membar}
${template1 \ Top\ 1}             ${template2}${top_mem name 1}               ${template3}${top_mem mem_res 1}
${template1 \ Top\ 2}             ${template2}${top_mem name 2}               ${template3}${top_mem mem_res 2}
${template1 \ Top\ 3}             ${template2}${top_mem name 3}               ${template3}${top_mem mem_res 3}

${template0 Filesystem}
${template1 \ @FILESYSTEM_LABEL@\}                  ${template2}${fs_free /} free               ${template3}${fs_used /} / ${fs_size /}
                                                                            ${template3}${fs_bar /}
${template1 \ IO\ Read}           ${template2}${diskio_read}                  ${template3}${diskiograph_read}
${template1 \ IO\ Write}          ${template2}$diskio_write                   ${template3}$diskiograph_write

${template1 \ Top\ 1}             ${template2}${top_io name 1}                ${template3}${top_io io_perc 1}%
${template1 \ Top\ 2}             ${template2}${top_io name 2}                ${template3}${top_io io_perc 2}%
${template1 \ Top\ 3}             ${template2}${top_io name 3}                ${template3}${top_io io_perc 3}%

${template0 Networking}
${template1 \ WiFi\ IP}                  ${template3}${addr @WIFI_INTERFACE@}
${template1 \ AP}                        ${template3}${wireless_essid @WIFI_INTERFACE@}
${template1 \ Signal}        ${template2}${wireless_link_qual_perc @WIFI_INTERFACE@} ${template3}${wireless_link_bar @WIFI_INTERFACE@}
${template1 \ Download}      ${template2}${downspeed @WIFI_INTERFACE@}              ${template3}${downspeedgraph @WIFI_INTERFACE@}
${template1 \ Upload}        ${template2}${upspeed @WIFI_INTERFACE@}                ${template3}${upspeedgraph @WIFI_INTERFACE@}
${template1 \ Total\ Down\ /\ Up}             ${template3}${totaldown @WIFI_INTERFACE@} ↓ / ${totalup @WIFI_INTERFACE@} ↑

${template1 \ Eth\ IP}                   ${template3}${addr @ETHERNET_INTERFACE@}
${template1 \ Download}      ${template2}${downspeed @ETHERNET_INTERFACE@}               ${template3}${downspeedgraph @ETHERNET_INTERFACE@}
${template1 \ Upload}        ${template2}${upspeed @ETHERNET_INTERFACE@}                 ${template3}${upspeedgraph @ETHERNET_INTERFACE@}
${template1 \ Total\ Down\ /\ Up}             ${template3}${totaldown @ETHERNET_INTERFACE@} ↓ / ${totalup @ETHERNET_INTERFACE@} ↑

]];
